<!DOCTYPE html>
<html lang="en">
<head>



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Handed Judd Rook</title>
  <style>
    :root {
      --bg: #0e1714;
      --panel: rgba(13, 28, 24, 0.92);
      --panel-2: rgba(24, 48, 40, 0.92);
      --felt: #17583f;
      --felt-dark: #0d3929;
      --felt-light: #257354;
      --ink: #f7f4e8;
      --muted: #b8c7bf;
      --gold: #f2c35e;
      --gold-dark: #9b6b16;
      --danger: #e66a62;
      --success: #76d39a;
      --shadow: 0 16px 45px rgba(0, 0, 0, 0.32);
      --card-w: clamp(56px, 6.6vw, 88px);
      --card-h: calc(var(--card-w) * 1.42);
      --red: #c93832;
      --yellow: #e2ab19;
      --green: #24804f;
      --black: #24282b;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(54, 107, 84, 0.24), transparent 32%),
        linear-gradient(145deg, #0d1513, #111e1a 50%, #090f0d);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto auto auto auto;
      align-content: start;
      gap: 6px;
      padding: 8px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .topbar,
    .scoreboard,
    .score-history,
    .control-panel,
    .log-panel {
      border: 1px solid rgba(255,255,255,0.09);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .topbar {
      position: sticky;
      top: 6px;
      z-index: 40;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 15px;
      padding: 7px 10px 7px 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #13130e;
      font-weight: 1000;
      font-size: 20px;
      background: linear-gradient(145deg, #ffe195, #d99b29);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 5px 14px rgba(0,0,0,.28);
      transform: rotate(-4deg);
    }

    .brand-title-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }

    .brand h1 {
      font-size: clamp(17px, 1.8vw, 23px);
      line-height: 1;
      margin: 0 0 2px;
      letter-spacing: -0.03em;
    }

    .version-badge {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    #reloadMark,
    #reloadTitle { cursor: pointer; }
    #reloadMark:focus-visible,
    #reloadTitle:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions,
    .button-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topbar > .top-actions {
      flex: 0 0 auto;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      padding: 7px 11px;
      color: var(--ink);
      background: rgba(255,255,255,.07);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.24);
    }

    .btn.primary {
      color: #19170f;
      font-weight: 800;
      border-color: #ffd778;
      background: linear-gradient(#ffd979, #e8b546);
    }

    .btn.danger {
      border-color: rgba(230,106,98,.45);
      background: rgba(230,106,98,.12);
    }

    .btn.moon {
      border-color: rgba(196, 155, 255, .58);
      background: linear-gradient(180deg, rgba(91, 54, 132, .92), rgba(43, 25, 68, .96));
      color: #f7eaff;
      font-weight: 850;
    }

    .btn.success {
      border-color: rgba(118,211,154,.5);
      background: rgba(118,211,154,.13);
    }

    .btn.small { padding: 6px 9px; font-size: 12px; }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      border-radius: 16px;
      overflow: hidden;
    }

    .table-scoreboard {
      position: absolute;
      z-index: 12;
      top: 10px;
      left: 50%;
      width: min(620px, calc(100% - 300px));
      min-width: 390px;
      transform: translateX(-50%);
      border-radius: 14px;
      background: rgba(7, 27, 20, .84);
      box-shadow: 0 8px 24px rgba(0,0,0,.26);
      backdrop-filter: blur(8px);
    }

    .team-score {
      display: grid;
      place-items: center;
      padding: 6px 12px;
    }

    .team-score.opponents {
      text-align: right;
    }

    .team-label {
      min-width: 0;
    }

    .team-label strong {
      display: block;
      font-size: 14px;
    }

    .team-label span {
      color: var(--muted);
      font-size: 11px;
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .score-value-wrap {
      min-width: 72px;
      display: grid;
      justify-items: center;
      gap: 3px;
    }

    .score-caption {
      color: rgba(255,255,255,.52);
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .score-value {
      min-width: 58px;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      text-align: center;
    }

    .hand-score {
      padding: 3px 7px;
      border-radius: 999px;
      color: #171810;
      background: var(--gold);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .hand-score.set {
      color: #fff;
      background: var(--red);
      box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 0 12px rgba(201,56,50,.45);
    }

    .score-center {
      display: grid;
      place-items: center;
      min-width: 132px;
      padding: 4px 10px;
      border-left: 1px solid rgba(255,255,255,.08);
      border-right: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.12);
      text-align: center;
    }

    .score-center strong { font-size: 13px; }
    .score-center span { color: var(--muted); font-size: 11px; }

    .score-history {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 34px;
      padding: 4px 8px;
      border-radius: 14px;
    }

    .topbar-last-trick {
      flex: 1 1 520px;
      width: min(520px, 46vw);
      min-width: 330px;
      min-height: 44px;
      justify-self: center;
      padding: 0 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .topbar-last-trick .score-history-list {
      justify-content: center;
    }

    .topbar-last-trick .last-trick-summary {
      justify-content: center;
    }

    .score-history-heading {
      padding: 0 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .score-history-list {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 1px;
    }

    .score-history-empty {
      align-self: center;
      color: rgba(255,255,255,.42);
      font-size: 11px;
    }

    .last-trick-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-width: 0;
    }

    .last-trick-cards {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      min-width: 0;
    }

    .last-trick-play {
      display: grid;
      justify-items: center;
      gap: 2px;
      padding: 3px 4px 4px;
      border: 1px solid transparent;
      border-radius: 9px;
    }

    .last-trick-play.winner {
      border-color: rgba(242,195,94,.55);
      background: rgba(242,195,94,.1);
    }

    .last-trick-card {
      --card-w: 34px;
      --card-h: 48px;
      flex: 0 0 var(--card-w) !important;
      width: var(--card-w) !important;
      height: var(--card-h) !important;
      margin: 0 !important;
      border-width: 1px;
      border-radius: 5px;
      box-shadow: 0 3px 6px rgba(0,0,0,.3);
      transform: none !important;
    }

    .last-trick-card::after {
      inset: 3px;
      border-width: 1px;
    }

    .last-trick-card .corner.top { top: 4px; left: 4px; }
    .last-trick-card .corner.bottom { bottom: 4px; right: 4px; }
    .last-trick-card .corner .pip { margin-top: 1px; }
    .last-trick-card .suit-name { margin-top: 2px; letter-spacing: .08em; }
    .last-trick-card .rook-bird { box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.25); }
    .last-trick-card .rook-label { margin-top: 2px; letter-spacing: .08em; }

    .last-trick-result {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .last-trick-result strong {
      display: block;
      color: var(--gold);
      font-size: 11px;
    }

    .table-shell {
      position: relative;
      height: min(620px, calc(100vh - 190px));
      min-height: 500px;
      overflow: hidden;
      border-radius: 34px;
      border: 10px solid #3f2d1f;
      box-shadow:
        inset 0 0 0 3px #76563a,
        inset 0 0 65px rgba(0,0,0,.44),
        0 22px 60px rgba(0,0,0,.35);
      background:
        radial-gradient(circle at 50% 42%, rgba(72, 156, 113, .28), transparent 34%),
        radial-gradient(circle at 50% 50%, var(--felt-light), var(--felt) 48%, var(--felt-dark) 100%);
    }

    .table-shell::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 25px;
      pointer-events: none;
    }

    .player {
      position: absolute;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 145px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 14px;
      background: rgba(6,22,16,.72);
      box-shadow: 0 8px 20px rgba(0,0,0,.22);
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    }

    .player.active {
      border-color: rgba(255, 216, 121, .8);
      box-shadow: 0 0 0 3px rgba(242,195,94,.18), 0 8px 20px rgba(0,0,0,.22);
    }
    .player.leader {
      border-color: rgba(118, 211, 154, .95);
      box-shadow: 0 0 0 3px rgba(118,211,154,.18), 0 8px 20px rgba(0,0,0,.24);
    }
    .player.leader::before {
      content: "LEAD";
      position: absolute;
      left: -7px;
      top: -8px;
      padding: 3px 6px;
      border-radius: 8px;
      color: #17130b;
      background: var(--gold);
      font-size: 8px;
      font-weight: 950;
      letter-spacing: .04em;
    }

    .player.bid-winner::after {
      content: "BID";
      position: absolute;
      right: -7px;
      top: -8px;
      padding: 3px 6px;
      border-radius: 8px;
      color: #19170f;
      background: var(--gold);
      font-size: 9px;
      font-weight: 900;
    }

    .player.north { top: 154px; left: 50%; transform: translateX(-50%); }
    .player.west { left: 20px; top: 46%; transform: translateY(-50%); }
    .player.east { right: 20px; top: 46%; transform: translateY(-50%); }
    .player.south { left: 50%; bottom: 132px; transform: translateX(-50%); }
    .player.north.active { transform: translateX(-50%) translateY(2px); }
    .player.west.active { transform: translateY(-50%) translateX(2px); }
    .player.east.active { transform: translateY(-50%) translateX(-2px); }
    .player.south.active { transform: translateX(-50%) translateY(-2px); }

    .avatar {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
      border: 1px solid rgba(255,255,255,.18);
      font-weight: 900;
      color: var(--gold);
    }

    .player-meta { min-width: 0; }
    .player-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player.bidder-marker .player-name::after,
    .player.called-partner-marker .player-name::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 6px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 50%;
      background: #df3f3f;
      box-shadow: 0 0 0 2px rgba(223,63,63,.18), 0 1px 4px rgba(0,0,0,.42);
      vertical-align: 1px;
    }
    .player-detail { font-size: 10px; color: var(--muted); white-space: nowrap; }

    .mini-cards {
      display: flex;
      margin-left: auto;
      padding-left: 8px;
    }

    .mini-back {
      width: 16px;
      height: 23px;
      margin-left: -9px;
      border: 1px solid #e5d8b7;
      border-radius: 3px;
      background:
        linear-gradient(45deg, transparent 42%, rgba(255,255,255,.25) 42% 58%, transparent 58%),
        linear-gradient(-45deg, transparent 42%, rgba(255,255,255,.19) 42% 58%, transparent 58%),
        #6d1f24;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }

    .table-info {
      position: absolute;
      right: 18px;
      top: 14px;
      z-index: 13;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(4,18,13,.72);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 5px 14px rgba(0,0,0,.2);
      font-size: 11px;
      color: var(--muted);
    }

    .trump-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.72);
      background: #777;
    }

    .trick-area {
      position: absolute;
      left: 50%;
      top: 45%;
      width: clamp(300px, 38vw, 520px);
      height: clamp(230px, 35vh, 350px);
      transform: translate(-50%, -50%);
      border-radius: 45%;
      border: 1px dashed rgba(255,255,255,.1);
      background: rgba(0,0,0,.045);
    }

    .play-slot {
      position: absolute;
      min-width: var(--card-w);
      min-height: var(--card-h);
      display: grid;
      place-items: center;
    }

    .play-slot.north { top: 3px; left: 50%; transform: translateX(-50%); }
    .play-slot.south { bottom: 3px; left: 50%; transform: translateX(-50%); }
    .play-slot.west { left: 14px; top: 50%; transform: translateY(-50%) rotate(-4deg); }
    .play-slot.east { right: 14px; top: 50%; transform: translateY(-50%) rotate(4deg); }

    .slot-label {
      position: absolute;
      font-size: 10px;
      color: rgba(255,255,255,.3);
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .nest {
      position: absolute;
      z-index: 3;
      left: calc(50% + clamp(170px, 24vw, 325px));
      top: 47%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .nest-stack {
      position: relative;
      width: 42px;
      height: 58px;
      margin: 0 auto 5px;
    }

    .nest-card {
      position: absolute;
      inset: 0;
      border: 2px solid #eadfbd;
      border-radius: 6px;
      background:
        radial-gradient(circle, rgba(255,255,255,.26) 0 1px, transparent 2px) 0 0/8px 8px,
        #6e2227;
      box-shadow: 0 3px 8px rgba(0,0,0,.3);
    }
    .nest-card:nth-child(1) { transform: rotate(-7deg) translate(-5px, 2px); }
    .nest-card:nth-child(2) { transform: rotate(4deg) translate(4px, 1px); }

    .hand-zone {
      position: absolute;
      z-index: 6;
      left: 10px;
      right: 10px;
      bottom: 8px;
      height: 128px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }

    .hand {
      width: min(96%, 1120px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 20px 18px 3px;
      pointer-events: auto;
      overflow: visible;
    }

    .card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      margin-left: calc(var(--card-w) * var(--hand-overlap, -0.27));
      border: 2px solid #f0ebdb;
      border-radius: calc(var(--card-w) * .115);
      color: #20231f;
      background:
        linear-gradient(145deg, rgba(255,255,255,.97), rgba(239,235,218,.98));
      box-shadow: 0 8px 14px rgba(0,0,0,.34), inset 0 0 0 1px rgba(0,0,0,.05);
      user-select: none;
      transform-origin: 50% 120%;
      transition: transform .16s ease, filter .16s ease, opacity .16s ease, box-shadow .16s ease;
    }

    .card:first-child { margin-left: 0; }
    .card:disabled { opacity: 1; cursor: default; }
    .card.illegal:disabled { opacity: .68; }
    .card.playable { cursor: pointer; }
    .card.playable:hover,
    .card.playable:focus-visible {
      transform: translateY(-18px) rotate(0deg) !important;
      z-index: 20 !important;
      outline: none;
      box-shadow: 0 18px 24px rgba(0,0,0,.42), 0 0 0 3px rgba(242,195,94,.42);
    }

    .card.illegal { filter: saturate(.45) brightness(.67); opacity: .68; }
    .card.selected {
      transform: translateY(-22px) rotate(0deg) !important;
      box-shadow: 0 16px 25px rgba(0,0,0,.42), 0 0 0 4px var(--gold);
      z-index: 25 !important;
    }

    .card-origin-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .flying-card {
      position: fixed !important;
      z-index: 1000 !important;
      flex: none !important;
      margin: 0 !important;
      pointer-events: none !important;
      transform-origin: 50% 50% !important;
      transition: transform .38s cubic-bezier(.2,.72,.18,1), opacity .14s linear !important;
      will-change: transform, opacity;
    }

    .card.red { --suit: var(--red); }
    .card.yellow { --suit: var(--yellow); }
    .card.green { --suit: var(--green); }
    .card.black { --suit: var(--black); }
    .card.rook { --suit: #20231f; background: linear-gradient(145deg, #fff3c3, #e4bd59); }

    .card::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: calc(var(--card-w) * .07);
      border: 2px solid color-mix(in srgb, var(--suit) 80%, transparent);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      z-index: 2;
      display: grid;
      justify-items: center;
      line-height: .9;
      color: var(--suit);
      font-weight: 900;
      font-size: calc(var(--card-w) * .2);
    }
    .corner.top { top: 10px; left: 10px; }
    .corner.bottom { bottom: 10px; right: 10px; transform: rotate(180deg); }
    .corner .pip { margin-top: 4px; font-size: calc(var(--card-w) * .12); }

    .card-center {
      position: absolute;
      inset: 20% 13%;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--suit);
    }

    .big-value {
      font-size: calc(var(--card-w) * .52);
      font-weight: 1000;
      line-height: .8;
      letter-spacing: -.08em;
      text-shadow: 0 1px 0 white;
    }

    .suit-name {
      margin-top: 8px;
      font-size: calc(var(--card-w) * .105);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .15em;
    }

    .rook-bird {
      width: calc(var(--card-w) * .62);
      height: calc(var(--card-w) * .62);
      border-radius: 44% 56% 48% 52%;
      display: grid;
      place-items: center;
      color: #f2c35e;
      background: #1d231f;
      font-size: calc(var(--card-w) * .35);
      font-weight: 1000;
      transform: rotate(-7deg);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.25);
    }

    .rook-label {
      margin-top: 8px;
      color: #20231f;
      font-size: calc(var(--card-w) * .11);
      font-weight: 1000;
      letter-spacing: .16em;
    }

    .played-card {
      margin: 0;
    }

    @keyframes dealIn {
      from { transform: scale(.72) translateY(16px); opacity: .2; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .dealing-card {
      position: fixed;
      z-index: 75;

      height: 40px;
      pointer-events: none;
      border: 1px solid #eadfbd;

        linear-gradient(45deg, transparent 42%, rgba(255,255,255,.25) 42% 58%, transparent 58%),

        #6d1f24;
      box-shadow: 0 4px 10px rgba(0,0,0,.36);
      transform-origin: center;
    }

    .discard-selection-pile[hidden] { display: none; }

    .discard-selection-pile {
      position: absolute;
      z-index: 27;
      left: 50%;
      top: 48%;
      width: min(360px, 46vw);
      height: 150px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .discard-selection-label {
      position: absolute;
      left: 50%;
      top: -2px;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 11px;
      font-weight: 1000;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 2px 6px rgba(0,0,0,.55);
    }

    .discard-selection-card {
      --card-w: clamp(52px, 5.4vw, 72px);
      --card-h: calc(var(--card-w) * 1.42);
      position: absolute;
      left: 50%;
      top: 56%;
      width: var(--card-w);
      height: var(--card-h);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: center;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,.35));
    }

    .discard-selection-card:hover {
      z-index: 40 !important;
      margin-top: -8px;
    }

    .discard-selection-card .card {
      width: var(--card-w);
      height: var(--card-h);
      margin: 0 !important;
      transform: none !important;
      pointer-events: none;
    }

    .kitty-reveal[hidden] { display: none; }

    .kitty-reveal {
      position: absolute;
      z-index: 26;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      display: grid;
      justify-items: center;
      gap: 9px;
      padding: 12px 16px 14px;
      border: 1px solid rgba(242,195,94,.5);
      border-radius: 16px;
      background: rgba(6, 24, 17, .92);
      box-shadow: 0 18px 42px rgba(0,0,0,.42), inset 0 0 28px rgba(0,0,0,.22);
      cursor: pointer;
    }

    .kitty-reveal-title {
      color: var(--gold);
      font-size: 12px;
      font-weight: 1000;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .kitty-reveal-cards {
      display: flex;
      justify-content: center;
      gap: 8px;
      perspective: 900px;
    }

    .kitty-reveal-cards.large-kitty {
      max-width: min(690px, 82vw);
      flex-wrap: wrap;
      row-gap: 7px;
    }

    .kitty-reveal-cards.large-kitty .kitty-reveal-card {
      --card-w: clamp(48px, 4.7vw, 66px);
    }

    .kitty-reveal-card {
      --card-w: clamp(56px, 5.5vw, 76px);
      --card-h: calc(var(--card-w) * 1.42);
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      perspective: 700px;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .kitty-reveal-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: kittyFlip .58s cubic-bezier(.2,.72,.2,1) forwards;
      animation-delay: var(--delay, 0ms);
    }

    .kitty-reveal-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .kitty-reveal-back {
      border: 2px solid #eadfbd;
      border-radius: calc(var(--card-w) * .115);
      background:
        radial-gradient(circle, rgba(255,255,255,.25) 0 1px, transparent 2px) 0 0/8px 8px,
        linear-gradient(135deg, rgba(255,255,255,.08), transparent 42%),
        #6e2227;
      box-shadow: 0 8px 14px rgba(0,0,0,.34);
    }

    .kitty-reveal-front { transform: rotateY(180deg); }
    .kitty-reveal-front .card {
      width: var(--card-w);
      height: var(--card-h);
      margin: 0 !important;
      transform: none !important;
      pointer-events: none;
    }

    .kitty-reveal-hint {
      color: var(--ink);
      font-size: 11px;
      font-weight: 850;
    }

    @keyframes kittyFlip {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(180deg); }
    }

    .claim-table-reveal[hidden] { display: none; }

    .claim-table-reveal {
      position: absolute;
      z-index: 25;
      inset: 84px 18px 10px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 24px;
      background: rgba(5, 24, 17, .88);
      box-shadow: inset 0 0 45px rgba(0,0,0,.28), 0 12px 35px rgba(0,0,0,.28);
      backdrop-filter: blur(5px);
      cursor: pointer;
    }

    .claim-table-hand {
      position: absolute;
      display: grid;
      justify-items: center;
      gap: 5px;
      max-width: 46%;
    }

    .claim-table-hand.north { top: 10px; left: 50%; transform: translateX(-50%); }
    .claim-table-hand.south { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .claim-table-hand.west { left: 10px; top: 50%; transform: translateY(-50%); }
    .claim-table-hand.east { right: 10px; top: 50%; transform: translateY(-50%); }

    .claim-table-name {
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
    }

    .claim-table-cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .claim-table-card {
      --card-w: 42px;
      --card-h: 60px;
      flex: 0 0 var(--card-w) !important;
      width: var(--card-w) !important;
      height: var(--card-h) !important;
      margin: 0 !important;
      border-width: 1px;
      border-radius: 6px;
      transform: none !important;
    }

    .claim-table-card::after { inset: 3px; border-width: 1px; }
    .claim-table-card .corner.top { top: 4px; left: 4px; }
    .claim-table-card .corner.bottom { bottom: 4px; right: 4px; }
    .claim-table-card .corner .pip { margin-top: 1px; }
    .claim-table-card .suit-name,
    .claim-table-card .rook-label { margin-top: 2px; letter-spacing: .06em; }

    .claim-table-continue {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(0,0,0,.36);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .control-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 56px;
      border-radius: 15px;
      padding: 8px 12px;
    }

    .prompt { min-width: 0; }
    .prompt strong { display: block; font-size: 15px; margin-bottom: 3px; }
    .prompt span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .game-controls { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

    .stats-ticker {
      min-height: 46px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 15px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: opacity .18s ease, transform .18s ease;
    }

    .stats-ticker[hidden] { display: none; }
    .stats-ticker.changing { opacity: .25; transform: translateY(2px); }
    .stats-ticker-label {
      color: var(--gold);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .stats-ticker-text {
      min-width: 0;
      font-size: 13px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stats-ticker-count {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bid-picker {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px;
      border-radius: 12px;
      background: rgba(0,0,0,.18);
    }

    .bid-value {
      min-width: 56px;
      text-align: center;
      font-weight: 900;
      color: var(--gold);
    }

    .log-panel {
      border-radius: 15px;
      padding: 8px 12px;
      max-height: 72px;
      overflow: auto;
    }

    .log-line {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .log-line:last-child { border-bottom: 0; }
    .log-line time { color: rgba(255,255,255,.35); font-variant-numeric: tabular-nums; }

    .toast {
      position: fixed;
      z-index: 80;
      top: 82px;
      left: 50%;
      transform: translate(-50%, -10px);
      min-width: 220px;
      max-width: min(90vw, 540px);
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 13px;
      color: var(--ink);
      background: rgba(8, 22, 17, .94);
      box-shadow: var(--shadow);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(4,9,7,.72);
      backdrop-filter: blur(7px);
    }
    .modal-backdrop.open { display: grid; }
    .modal-backdrop.trump-choice {
      z-index: 35;
      place-items: start center;
      padding-top: 92px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .modal-backdrop.trump-choice .modal {
      width: min(560px, 94vw);
      background: linear-gradient(145deg, rgba(24,56,46,.98), rgba(12,33,26,.98));
    }

    .modal {
      width: min(620px, 96vw);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 22px;
      padding: 20px;
      color: var(--ink);
      background: linear-gradient(145deg, #18382e, #0c211a);
      box-shadow: 0 28px 90px rgba(0,0,0,.55);
    }

    .modal h2 { margin: 0 0 6px; font-size: 23px; }
    .modal > p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .modal.claim-reveal-modal {
      width: min(920px, 96vw);
    }

    .claim-reveal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .claim-reveal-hand {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: rgba(0,0,0,.16);
    }

    .claim-reveal-hand strong {
      display: block;
      margin-bottom: 9px;
      color: var(--gold);
      font-size: 13px;
    }

    .claim-reveal-cards {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 6px;
    }

    .claim-reveal-card {
      --card-w: 50px;
      --card-h: 71px;
      flex: 0 0 var(--card-w) !important;
      width: var(--card-w) !important;
      height: var(--card-h) !important;
      margin: 0 !important;
      border-width: 1px;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,.3);
      transform: none !important;
    }

    .claim-reveal-card::after {
      inset: 3px;
      border-width: 1px;
    }

    .claim-reveal-card .corner.top { top: 5px; left: 5px; }
    .claim-reveal-card .corner.bottom { bottom: 5px; right: 5px; }
    .claim-reveal-card .corner .pip { margin-top: 2px; }
    .claim-reveal-card .suit-name,
    .claim-reveal-card .rook-label { margin-top: 3px; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .field input,
    .field select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      padding: 10px 11px;
      color: var(--ink);
      background: rgba(0,0,0,.22);
      outline: none;
    }
    .field input:focus,
    .field select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,195,94,.13); }
    .field option { background: #17352c; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .final-score {
      margin: 8px 0 14px;
      color: var(--gold);
      font-size: 20px;
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .summary-card {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      padding: 14px;
      background: rgba(0,0,0,.15);
    }
    .summary-card strong { display: block; margin-bottom: 7px; }
    .summary-card .big { color: var(--gold); font-size: 30px; font-weight: 1000; }
    .summary-card span { color: var(--muted); font-size: 12px; }

    .color-choices {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .color-choices.four-options {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .color-choice {
      min-height: 72px;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 13px;
      color: white;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    .color-choice.red { background: var(--red); }
    .color-choice.yellow { background: var(--yellow); color: #2b2411; text-shadow: none; }
    .color-choice.green { background: var(--green); }
    .color-choice.black { background: var(--black); }
    .color-choice.no-trump {
      background: linear-gradient(145deg, #5d675f, #303833);
    }
    .color-choice:hover { border-color: white; transform: translateY(-1px); }

    .rules-note {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 11px;
      color: var(--muted);
      background: rgba(0,0,0,.14);
      font-size: 11px;
      line-height: 1.5;
    }

    .confetti {
      position: fixed;
      z-index: 150;
      top: -20px;
      width: 9px;
      height: 16px;
      border-radius: 2px;
      pointer-events: none;
      animation: fall 2.7s linear forwards;
    }
    .final-score { white-space: normal; overflow-wrap: anywhere; }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(760deg); opacity: .15; }
    }

    @media (max-width: 900px) {
      .app { grid-template-rows: auto auto auto auto auto auto; padding: 6px; gap: 5px; }
      .brand p { display: none; }
      .topbar { border-radius: 14px; }
      .scoreboard { grid-template-columns: 1fr 100px 1fr; }
      .table-scoreboard { width: min(590px, calc(100% - 250px)); min-width: 360px; }
      .topbar-last-trick { width: min(460px, 44vw); min-width: 290px; }
      .team-score { padding: 8px; }
      .score-value { font-size: 24px; min-width: 45px; }
      .score-history { grid-template-columns: 1fr; gap: 3px; }
      .score-history-heading { padding-left: 1px; }
      .table-shell { height: min(590px, calc(100vh - 175px)); min-height: 500px; border-width: 7px; border-radius: 23px; }
      .player { min-width: 120px; padding: 6px 8px; }
      .player.west { left: 8px; top: 42%; }
      .player.east { right: 8px; top: 42%; }
      .player.south { bottom: 120px; }
      .mini-cards { display: none; }
      .nest { left: auto; right: 9px; top: 53%; transform: none; }
      .trick-area { top: 45%; }
      .control-panel { grid-template-columns: 1fr; }
      .game-controls { justify-content: flex-start; }
      .settings-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }

    @media (max-width: 600px) {
      :root { --card-w: 54px; }
      .topbar { flex-wrap: wrap; }
      .top-actions .btn span { display: none; }
      .top-actions .btn { padding: 8px 10px; }
      .scoreboard { grid-template-columns: 1fr 80px 1fr; }
      .table-scoreboard { width: calc(100% - 20px); min-width: 0; top: 8px; }
      .topbar-last-trick { order: 3; flex-basis: 100%; width: 100%; min-width: 0; min-height: 42px; }
      .table-info { top: 78px; right: 9px; padding: 6px; }
      .table-info #tableInfoText { display: none; }
      .team-score { display: flex; flex-direction: column; gap: 2px; }
      .team-score.opponents { flex-direction: column-reverse; }
      .score-center { min-width: 80px; }
      .score-center strong { font-size: 11px; }
      .score-center span { font-size: 9px; }
      .score-history-heading { display: none; }
      .topbar-last-trick .last-trick-result { display: none; }
      .topbar-last-trick .last-trick-summary { justify-content: center; }
      .score-entry { min-width: 165px; }
      .table-shell { height: min(560px, calc(100vh - 160px)); min-height: 490px; }
      .player { min-width: auto; }
      .player .player-detail { display: none; }
      .player.north { top: 144px; }
      .player.west, .player.east { top: 38%; }
      .player.south { bottom: 117px; }
      .avatar { width: 28px; height: 28px; font-size: 12px; }
      .trick-area { width: 290px; height: 240px; top: 47%; }
      .play-slot.west { left: 2px; }
      .play-slot.east { right: 2px; }
      .nest { top: 22%; right: 7px; }
      .hand { justify-content: flex-start; overflow-x: auto; padding-left: 8px; padding-right: 8px; }
      .card { margin-left: -12px; }
      .card:first-child { margin-left: 0; }
      .color-choices { grid-template-columns: 1fr 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
    }


    /* Visual themes */
    body[data-theme="classic"] {
      --panel: rgba(28, 17, 8, .92);
      --panel-2: rgba(45, 27, 12, .94);
      --felt: #075531;
      --felt-dark: #02361f;
      --felt-light: #0b7042;
      --ink: #fff6df;
      --muted: #cfbea0;
      --gold: #e5b74f;
      --gold-dark: #8c5c0d;
      background:
        linear-gradient(90deg, rgba(255,255,255,.025), transparent 18%, rgba(0,0,0,.07) 48%, transparent 72%, rgba(255,255,255,.018)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,.025) 1px 4px),
        linear-gradient(90deg, #2a1207, #5a2d12 24%, #311607 49%, #643518 74%, #2d1408);
    }

    body[data-theme="classic"] .topbar {
      border-color: rgba(229,183,79,.34);
      background: linear-gradient(180deg, rgba(20,13,7,.98), rgba(8,7,5,.96));
      box-shadow: 0 7px 22px rgba(0,0,0,.42), inset 0 -1px rgba(229,183,79,.18);
    }

    body[data-theme="classic"] .brand-mark {
      color: #f1c766;
      border: 1px solid rgba(229,183,79,.52);
      background: radial-gradient(circle at 35% 28%, #44311e, #0d0b08 70%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.035), 0 4px 12px rgba(0,0,0,.5);
    }

    body[data-theme="classic"] .brand h1 {
      color: #f1cd75;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 2.35vw, 34px);
      font-weight: 800;
      letter-spacing: .035em;
      text-shadow: 0 2px 0 #3a1e08, 0 4px 12px rgba(0,0,0,.5);
    }

    body[data-theme="classic"] .table-shell {
      border-color: #45220d;
      box-shadow:
        inset 0 0 0 3px #a2682b,
        inset 0 0 0 7px #271407,
        inset 0 0 75px rgba(0,0,0,.48),
        0 20px 52px rgba(0,0,0,.48);
      background:
        radial-gradient(circle at 50% 40%, rgba(91,196,136,.20), transparent 34%),
        repeating-radial-gradient(circle at 42% 38%, rgba(255,255,255,.012) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 50% 50%, var(--felt-light), var(--felt) 50%, var(--felt-dark) 100%);
    }

    body[data-theme="classic"] .table-shell::before {
      border-color: rgba(228,184,84,.23);
      box-shadow: inset 0 0 16px rgba(0,0,0,.25);
    }

    body[data-theme="classic"] .table-scoreboard,
    body[data-theme="classic"] .player,
    body[data-theme="classic"] .table-info,
    body[data-theme="classic"] .control-panel {
      border-color: rgba(229,183,79,.34);
      background: linear-gradient(180deg, rgba(29,18,9,.94), rgba(10,9,6,.91));
      box-shadow: 0 8px 22px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.035);
    }

    body[data-theme="classic"] .btn {
      border-color: rgba(229,183,79,.32);
      background: linear-gradient(180deg, rgba(70,43,17,.9), rgba(28,18,9,.94));

    body[data-theme="casual"] .dealing-card {

    body[data-theme="casual"] .modal > p,
    body[data-theme="casual"] .rules-note,
    body[data-theme="casual"] .field label { color: #61778a; }

    body[data-theme="casual"] .field input,
    body[data-theme="casual"] .field select {
      color: #17324b;

    }

    body[data-theme="casual"] .field option { color: #17324b; background: white; }

    .theme-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .theme-choice {
      position: relative;
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 10px;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: rgba(0,0,0,.10);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .theme-choice:hover { transform: translateY(-1px); }
    .theme-choice:has(input:checked) {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent);
    }
    .theme-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .theme-choice strong { font-size: 13px; }
    .theme-choice small { color: var(--muted); font-size: 11px; }

    .theme-preview {
      position: relative;
      height: 88px;
      overflow: hidden;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.18);
    }

    .theme-preview::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 17%;
      bottom: 14%;
      border: 5px solid #70401c;
      border-radius: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,.25);
    }

    .theme-preview.classic {
      background: linear-gradient(90deg, #351707, #6b3516 48%, #2f1306);
    }
    .theme-preview.classic::before { background: radial-gradient(circle, #0b7042, #034327); border-color: #5b2c0e; }
    .theme-preview.casual { background: linear-gradient(145deg, #82b8de, #c1dfef); }
    .theme-preview.casual::before { background: radial-gradient(circle, #3478ad, #184b77); border-color: #8b572d; }

    @media (max-width: 620px) {
      .theme-choices { grid-template-columns: 1fr; }
    }


    /* Reference layout: classic wood table with the live numbers on the left. */
    .app {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      padding: 0;
      gap: 0;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      top: 0;
      min-height: 78px;
      padding: 8px 18px;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
    }

    .brand { min-width: 270px; gap: 14px; }
    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      line-height: 1;
      transform: none;
    }
    .brand-copy { display: grid; align-content: center; }
    .brand h1 { margin: 0; line-height: .88; }
    .brand p {
      margin-top: 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-style: italic;
      letter-spacing: .04em;
    }

    .game-layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 205px minmax(0, 1fr);
      gap: 14px;
      padding: 12px 16px 14px;
    }

    .game-sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-panel {
      overflow: hidden;
      border: 1px solid rgba(229,183,79,.42);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(28,17,8,.96), rgba(8,7,5,.95));
      box-shadow: 0 8px 22px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.035);
    }

    .sidebar-heading {
      padding: 10px 12px 8px;
      border-bottom: 1px solid rgba(229,183,79,.24);
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .sidebar-trump {
      position: static;
      z-index: auto;
      display: block;
      padding: 0;
      border-radius: 14px;
      font-size: 13px;
    }

    .trump-display {
      min-height: 64px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      padding: 9px 10px 11px;
      color: var(--ink);
      text-align: center;
      font-weight: 800;
    }

    .trump-display .trump-dot {
      width: 22px;
      height: 22px;
      border-width: 3px;
    }

    .bid-board { display: grid; }
    .bid-row {
      min-height: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      border-bottom: 1px solid rgba(255,255,255,.065);
      font-size: 12px;
    }
    .bid-row:last-child { border-bottom: 0; }
    .bid-row span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .bid-row strong { color: var(--gold); font-size: 14px; }
    .bid-row.active { background: rgba(229,183,79,.12); }
    .bid-row.passed strong { color: var(--muted); font-size: 12px; }
    .bid-row.winner { box-shadow: inset 3px 0 var(--gold); }

    .bid-trump-panel { padding: 0; overflow: hidden; }
    .bid-trump-line {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
    }
    .bid-inline, .trump-inline { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .bid-inline span, .trump-inline span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bid-inline strong { color: var(--gold); font-size: 18px; }
    .trump-inline { color: var(--muted); font-size: 10px; }
    .trump-inline .trump-dot { width: 15px; height: 15px; flex: 0 0 auto; }
    .bid-status-list { border-top: 1px solid rgba(255,255,255,.08); }
    .bid-status-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; font-size: 10px; }
    .bid-status-row strong { color: var(--gold); }
    .bid-status-row.passed { color: var(--muted); }
    .bid-status-row.passed strong { color: var(--muted); }
    .bid-status-row.active { background: rgba(229,183,79,.11); }

    .trump-announcement {
      position: absolute;
      z-index: 85;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 26px;
      border: 2px solid var(--gold);
      border-radius: 16px;
      color: var(--ink);
      background: rgba(18,12,7,.96);
      box-shadow: 0 18px 45px rgba(0,0,0,.55);
      pointer-events: none;
      animation: trumpNoticeIn .18s ease-out;
    }
    .trump-announcement strong { font-size: 22px; white-space: nowrap; }
    .trump-announcement .trump-dot { width: 26px; height: 26px; }
    @keyframes trumpNoticeIn { from { opacity: 0; transform: translate(-50%,-46%) scale(.94); } }

    .sidebar-scoreboard {
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      border-radius: 14px;
    }

    .sidebar-scoreboard .team-score {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      place-items: center stretch;
      gap: 8px;
      padding: 9px 11px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      text-align: left;
    }

    .sidebar-scoreboard .sidebar-score-name {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-scoreboard .score-value-wrap {
      min-width: 58px;
      justify-items: end;
      gap: 4px;
    }
    .sidebar-scoreboard .score-value { min-width: 0; font-size: 23px; }
    .sidebar-scoreboard .hand-score { font-size: 8px; padding: 3px 5px; }
    .sidebar-scoreboard .score-center {
      min-width: 0;
      padding: 9px 8px;
      border: 0;
      background: rgba(229,183,79,.055);
    }
    .sidebar-scoreboard .score-center strong { color: var(--gold); }

    .sidebar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: auto;
    }
    #newGameButton, #goDownButton { grid-column: 1 / -1; }
    .sidebar-actions .btn {
      width: 100%;
      min-height: 48px;
      justify-content: center;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .035em;
    }

    .sidebar-actions .sidebar-go-down {
      min-height: 36px;
      padding-block: 5px;
      font-size: 11px;
      opacity: .82;
    }

    .sidebar-actions .sidebar-go-down:hover:not(:disabled) {
      opacity: 1;
    }

    .stats-modal {
      width: min(760px, calc(100% - 16px));
    }
    .stats-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 7px;
    }
    .stats-card {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      background: rgba(0,0,0,.15);
      padding: 8px 9px;
    }
    .stats-card h3 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: 13px;
    }
    .stats-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 10px;
      font-size: 10px;
      line-height: 1.25;
    }
    .stats-list span:nth-child(odd) { color: var(--muted); }
    .stats-list strong { text-align: right; }
    .stats-trump-line {
      grid-column: 1 / -1;
      margin-top: 3px;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
    }
    @media (max-width: 760px), (max-height: 520px) {
      .stats-modal { width: min(660px, calc(100% - 12px)); }
      .stats-columns { gap: 5px; }
      .stats-card { padding: 5px 6px; }
      .stats-card h3 { font-size: 10px; margin-bottom: 3px; }
      .stats-list { font-size: 8px; gap: 2px 6px; }
      .stats-trump-line { font-size: 7.5px; }
    }

    .game-main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(520px, 1fr) auto auto;
      gap: 10px;
    }

    .table-shell {
      width: 100%;
      height: min(720px, calc(100vh - 178px));
      min-height: 520px;
      border-radius: 42px;
    }

    .player.north { top: 20px; }
    .player.west { left: 18px; top: 44%; }
    .player.east { right: 18px; top: 44%; }
    .player.south { bottom: 130px; }
    .trick-area { top: 47%; }

    .control-panel {
      min-height: 74px;
      height: 74px;
      display: grid;
      grid-template-columns: 1fr;
      padding: 11px 14px;
      border-radius: 18px;
    }
    .control-panel .prompt { display: none; }
    .game-controls {
      justify-content: center;
      gap: 10px;
    }
    .game-controls .btn { min-width: 104px; min-height: 45px; font-weight: 850; }
    .game-controls .btn.moon { min-width: 185px; }

    body[data-theme="classic"] .game-layout {

        linear-gradient(90deg, rgba(255,255,255,.018), transparent 22%, rgba(0,0,0,.04) 50%, transparent 75%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, rgba(0,0,0,.018) 1px 4px),

<script>

const state={token:null,name:null,seat:null,data:null,poll:null,heartbeat:null,lastAutoTrumpHand:0,lastScorePopupHand:0,bidDraft:null,lastObservedTrump:null,lastObservedTrumpHand:0,trumpNoticeTimer:null};
const els={
  modalBackdrop:document.getElementById("modalBackdrop"),modal:document.getElementById("modal"),toast:document.getElementById("toast"),hand:document.getElementById("humanHand"),controls:document.getElementById("gameControls"),promptTitle:document.getElementById("promptTitle"),promptText:document.getElementById("promptText"),scoreEntries:document.getElementById("scoreEntries"),bidWinnerName:document.getElementById("bidWinnerName"),bidWinnerValue:document.getElementById("bidWinnerValue"),bidStatusList:document.getElementById("bidStatusList"),handLabel:document.getElementById("handLabel"),targetLabel:document.getElementById("targetLabel"),trumpDot:document.getElementById("trumpDot"),tableInfoText:document.getElementById("tableInfoText"),tableShell:document.getElementById("tableShell"),nestLabel:document.getElementById("nestLabel"),scoreHistoryList:document.getElementById("scoreHistoryList"),kittyStage:document.getElementById("kittyStage")
};
function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function showToast(t){els.toast.textContent=t;els.toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>els.toast.classList.remove("show"),1900);}

async function api(path,options={}){const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||"Request failed");return d;}
function cardInner(c){if(c.rook)return '<div class="corner top"><span>R</span></div><div class="card-center"><div><div class="rook-bird">R</div><div class="rook-label">ROOK</div></div></div><div class="corner bottom"><span>R</span></div>';return `<div class="corner top"><span>${c.value}</span></div><div class="card-center"><div><div class="big-value">${c.value}</div><div class="suit-name">${c.suit}</div></div></div><div class="corner bottom"><span>${c.value}</span></div>`;}
function cardHtml(c,extra=""){return `<div class="card ${c.rook?"rook":c.suit} ${extra}">${cardInner(c)}</div>`;}
function playerState(i){return state.data?.seats?.[i];}
function render(){const s=state.data;if(!s)return;
  if(!s.lastHandResult&&s.handNumber<=state.lastScorePopupHand)state.lastScorePopupHand=0;
  els.tableShell.dataset.playerCount="3";els.tableShell.classList.toggle("reveal-trick",s.phase==="trickReveal");
  if(!els.hand)return;els.hand.innerHTML="";const visibleHand=s.hands[state.seat]||[];const handZone=els.hand.parentElement;if(handZone)handZone.classList.toggle("expanded-hand",visibleHand.length>12);visibleHand.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className=`card ${c.rook?"rook":c.suit}`;b.dataset.cardId=c.id;b.style.zIndex=String(i+1);b.innerHTML=cardInner(c);const active=s.phase==="playing"&&s.turn===state.seat;const discard=s.phase==="discard"&&s.highBidder===state.seat;const selected=(s.selectedDiscards||[]).includes(c.id);if(discard){b.classList.add("playable");b.classList.toggle("selected",selected);bindDiscardClicks(b,c);}else if(active){b.classList.add("playable");b.onclick=()=>send({action:"play",cardId:c.id});}else b.disabled=true;els.hand.appendChild(b);});
  const showLeader=s.highBidder!==null&&["pickup","discard","playing","trickReveal"].includes(s.phase);for(let i=0;i<3;i++){const p=playerState(i);document.getElementById(`name${i}`).textContent=p?.name||["Daryl","Cristi","Cindy"][i];document.getElementById(`avatar${i}`).textContent=(p?.name||["Daryl","Cristi","Cindy"][i]).charAt(0);document.getElementById(`detail${i}`).textContent=p?.bot?"Bot":p?.connected?"Live":"Waiting";document.getElementById(`player${i}`).classList.toggle("active",(s.phase==="playing"&&s.turn===i)||(s.phase==="bidding"&&s.currentBidder===i));document.getElementById(`player${i}`).classList.toggle("leader",showLeader&&s.leader===i);document.getElementById(`player${i}`).classList.toggle("bid-winner",s.highBidder===i);const mini=document.getElementById(`mini${i}`);if(mini)mini.innerHTML="";for(let k=0;k<(s.handCounts[i]||0);k++){const x=document.createElement("span");x.className="mini-back";if(mini)mini.appendChild(x);}const pointsEl=document.getElementById(`handPoints${i}`);if(pointsEl)pointsEl.textContent=s.highBidder===i?`Bid ${s.highBid}`:`${s.scores[i]||0}`;}

  els.bidWinnerName.textContent=s.highBidder===null?"No bid":playerState(s.highBidder)?.name||"Bidder";els.bidWinnerValue.textContent=s.highBid||"â€”";els.handLabel.textContent=s.handNumber?`Hand ${s.handNumber}`:"Waiting";els.targetLabel.textContent="First to 1000";els.nestLabel.textContent=`${s.kittyCount||0}-card kitty`;els.tableInfoText.textContent=s.trump?(s.trump==="none"?"No Trump":`${s.trump} trump`):"";els.trumpDot.hidden=!s.trump;els.trumpDot.style.background=s.trump&&s.trump!=="none"?`var(--${s.trump})`:"#777";if((s.phase==="scoring"||s.phase==="gameover")&&s.lastHandResult&&s.handNumber!==state.lastScorePopupHand){state.lastScorePopupHand=s.handNumber;showHandScorePopup(s);}
  if(els.scoreEntries)els.scoreEntries.innerHTML=s.seats.map((p,i)=>`<div class="team-score"><div class="sidebar-score-name">${escapeHtml(p.name)}</div><div class="score-value-wrap"><div class="score-value">${s.scores[i]||0}</div></div></div>`).join("");els.promptTitle.textContent=s.prompt||"3-Handed Judd Rook";els.promptText.textContent=promptText(s);renderBidStatuses(s);syncTrumpAnnouncement(s);renderKittyStage(s);renderLastTrick(s);renderControls();
}
function renderBidStatuses(s){if(!els.bidStatusList)return;const visible=s.phase==="bidding";els.bidStatusList.hidden=!visible;if(!visible){els.bidStatusList.innerHTML="";return;}const latest=[null,null,null];for(const entry of s.bidHistory||[])latest[entry.seat]=entry;els.bidStatusList.innerHTML=(s.seats||[]).map((player,seat)=>{const entry=latest[seat],passed=!!s.passed?.[seat]||entry?.passed;let status=passed?"Passed":typeof entry?.bid==="number"?`Bid ${entry.bid}`:s.currentBidder===seat?"Choosing…":"Still bidding";return `<div class="bid-status-row ${passed?"passed":""} ${s.currentBidder===seat?"active":""}"><span>${escapeHtml(player.name)}</span><strong>${status}</strong></div>`;}).join("");}
function clearTrumpOverlays(){clearTimeout(state.trumpNoticeTimer);state.trumpNoticeTimer=null;document.getElementById("trumpAnnouncement")?.remove();document.getElementById("trumpPickerBar")?.remove();}

  const existingBid=els.controls.querySelector(".bid-value-input"),currentMin=s.highBid?(s.highBid<200?s.highBid+5:400):150;
  if(existingBid&&s.phase==="bidding"&&s.currentBidder===state.seat&&Number(existingBid.options[0]?.value)===currentMin)return;
  renderControlsWithoutDuplicates();
  [...els.controls.querySelectorAll("button")].forEach(button=>{if(["Start Game","Choose Trump"].includes(button.textContent.trim()))button.remove();});
  els.controls.querySelectorAll(".bitter-bunch-option").forEach(option=>option.remove());
  if(s.phase==="bidding"&&!s.highBid){[...els.controls.querySelectorAll("button")].find(button=>button.textContent.trim()==="Pass")?.remove();if(s.currentBidder===state.seat){const votes=s.bitterVotes||[],wrap=document.createElement("div"),bitter=document.createElement("button");wrap.className="bitter-bunch-option";bitter.type="button";bitter.className="btn bitter-bunch";bitter.textContent=`Bitter Bunch — agree ${votes.filter(Boolean).length}/3`;bitter.disabled=!!votes[state.seat];bitter.onclick=()=>send({action:"bitterBunch"});wrap.appendChild(bitter);els.controls.appendChild(wrap);}}
  const goDown=document.getElementById("goDownButton"),canGoDown=!!s.canGoDown;if(goDown){goDown.hidden=!canGoDown;goDown.disabled=!canGoDown;}
  if(s.phase==="playing"&&s.canClaimRest){const claim=document.createElement("button");claim.type="button";claim.className="btn success";claim.textContent="The Rest Are Mine";claim.onclick=async()=>{state.lastScorePopupHand=0;await send({action:"claimRest"});};els.controls.appendChild(claim);}
};
openTrumpPicker=function(){
  const s=state.data;if(!s||s.phase!=="pickup"||s.highBidder!==state.seat||!s.kittyAccepted)return;
  document.getElementById("trumpPickerBar")?.remove();
  const choices=["red","yellow","green","black","none"],bar=document.createElement("div");bar.id="trumpPickerBar";bar.className="trump-picker-bar";bar.innerHTML=`<strong>Choose Trump</strong>${choices.map(choice=>`<button type="button" class="color-choice ${choice==="none"?"no-trump":choice}" data-trump="${choice}">${choice==="none"?"No Trump":choice[0].toUpperCase()+choice.slice(1)}</button>`).join("")}`;els.tableShell.appendChild(bar);
  bar.querySelectorAll("[data-trump]").forEach(button=>button.onclick=async()=>{if(state.actionBusy)return;bar.querySelectorAll("button").forEach(item=>item.disabled=true);await send({action:"trump",trump:button.dataset.trump});if(state.data?.phase==="discard"){bar.remove();render();}else bar.querySelectorAll("button").forEach(item=>item.disabled=false);});
};
function fitExpandedHand(){
  const zone=els.hand.parentElement,cards=[...els.hand.querySelectorAll(".card")];
  if(!zone||cards.length<=12){els.hand.style.removeProperty("--expanded-gap");return;}
  const cardWidth=cards[0].getBoundingClientRect().width,available=Math.max(1,zone.clientWidth-24),needed=(available-cardWidth)/(cards.length-1)-cardWidth,gap=Math.max(-cardWidth+16,Math.min(-8,needed));
  els.hand.style.setProperty("--expanded-gap",`${gap}px`);
}
const renderWithFittedHand=render;
render=function(){renderWithFittedHand();fitExpandedHand();};
const showScorePopupWithTeamTotals=showHandScorePopup;
showHandScorePopup=function(s){showScorePopupWithTeamTotals(s);els.modal.querySelectorAll(".summary-card span").forEach(span=>{if(span.textContent.includes("Shared defender"))span.textContent="Defender-team total";});els.modal.querySelectorAll(".table-dialog-summary").forEach(note=>{if(note.textContent.includes("Defenders shared"))note.innerHTML=`<strong>Each defender receives ${s.lastHandResult?.defenderTotal||0} points.</strong>`;});};
const showScorePopupWithClaimReveal=showHandScorePopup;
showHandScorePopup=function(s){showScorePopupWithClaimReveal(s);if(!Array.isArray(s.claimReveal)||!s.claimReveal.length)return;els.modal.className="modal hand-score-modal";const actions=els.modal.querySelector(".modal-actions"),layout=document.createElement("div"),summary=document.createElement("section"),reveal=document.createElement("section");layout.className="score-result-layout";summary.className="score-result-summary";reveal.className="claim-reveal";const heading=s.lastHandResult?.wentDown?"Remaining Cards — Hand Ended":"Remaining Cards — Claimed by "+escapeHtml(playerState(s.highBidder)?.name||"Bidder");reveal.innerHTML=`<h3>${heading}</h3>${s.claimReveal.map((hand,seat)=>`<div class="claim-reveal-row"><strong>${escapeHtml(playerState(seat)?.name||"")}</strong><div class="claim-reveal-cards">${hand.map(card=>cardHtml(card)).join("")}</div></div>`).join("")}`;[...els.modal.children].filter(node=>node!==actions).forEach(node=>summary.appendChild(node));layout.append(summary,reveal);els.modal.insertBefore(layout,actions);};
const renderWithHandPoints=render;
render=function(){renderWithHandPoints();const s=state.data;if(!s)return;const bidderSet=bidderIsCurrentlySet(s);for(let i=0;i<3;i++){const points=document.getElementById(`handPoints${i}`);if(points){points.textContent=`${s.handPoints?.[i]||0}`;points.classList.toggle("set",bidderSet&&i===s.highBidder);}}if(s.canRedeal&&state.lastMisdealHand!==s.handNumber){state.lastMisdealHand=s.handNumber;const hand=s.hands[state.seat]||[];openModal(`<h2>Misdeal</h2><p class="table-dialog-summary">Your hand has no point cards. You may request a redeal before bidding begins.</p><div class="misdeal-hand">${hand.map(card=>cardHtml(card)).join("")}</div><div class="modal-actions"><button class="btn primary" id="misdealRedeal">Re-Deal</button></div>`);document.getElementById("misdealRedeal").onclick=async()=>{await send({action:"redeal"});closeModal();};}};
document.getElementById("changePlayerButton").onclick=choosePlayer;document.getElementById("settingsButton").onclick=openSettings;document.getElementById("newGameButton").onclick=()=>{if(state.token)send({action:"newGame"});else choosePlayer();};document.getElementById("startButton").onclick=()=>{if(state.token)send({action:"start"});else choosePlayer();};document.getElementById("goDownButton").onclick=()=>send({action:"goDown"});els.modalBackdrop.addEventListener("click",e=>{if(e.target===els.modalBackdrop)closeModal();});
(function boot(){const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(saved?.token){state.token=saved.token;state.name=saved.name;state.seat=saved.seat;startPolling();}else{choosePlayer();}})();

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const gameNight = params.get("gameNight");
  if (!gameNight) return;

  const style = document.createElement("style");
  style.textContent = `
    #gameNightReturn {
      position: fixed; right: 14px; bottom: 14px; z-index: 9999;
      min-height: 38px; padding: 8px 12px; border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px; color: #fff4d0; background: rgba(13,8,18,.88);
      box-shadow: 0 4px 18px rgba(0,0,0,.35); font: 800 12px/1 Inter,Segoe UI,Arial,sans-serif;
      cursor: pointer;
    }
    #gameNightReturn:hover { filter: brightness(1.18); }
    @media (max-width: 760px) { #gameNightReturn { right: 8px; bottom: 8px; min-height: 32px; padding: 6px 9px; font-size: 10px; } }
  `;
  document.head.append(style);

  const button = document.createElement("button");
  button.id = "gameNightReturn";
  button.type = "button";
  button.textContent = "← Game Night";
  button.onclick = () => location.assign(gameNight);
  document.body.append(button);

  if (params.get("gameNightNew") === "1") {
    window.setTimeout(() => document.getElementById("newGameButton")?.click(), 800);
  }
})();
</script>
